fidelity:
  divergences: 'None known. Each Challenge statement is written with Mathlib''s notions only. (algebraicClosure
    ℚ ℂ).toSubfield is Q̄, the algebraic numbers as a subfield of ℂ. Submodule.span Q̄ (insert 1 {u
    | IsAlgebraic ℚ (exp u)}) is ℒ̃. The statement is unconditional: no hypothesis stands in for the
    multiplicity estimate. The zero block is the entries (P * M * Q) i j with i < d'' and j ≥ l''.
    M.rank is Mathlib''s rank over ℂ; P, Q have entries in Q̄ and unit determinant. The compared theorems
    live in the namespace StrongSixExponentials and the library theorems keep their library names;
    the statements are the same up to unfolding the library''s abbreviations.'
review:
  status: machine-checked; no human expert review of the Lean
  reviewers: []
  notes: 'Checks made: the Prove2Me platform checked and accepted the proofs when they were first
    submitted, and diaz-modulus-lean builds them in CI with leanprover/lean4:v4.35.0 and Mathlib v4.35.0.
    This repository''s CI builds the extract, audits the axioms with #print axioms, and runs the toolchain''s
    lake comparator. No mathematician has reviewed the Lean code, and the Challenge statements have
    not been reviewed against the sources by anyone independent of their authors.'
