# formalization.yaml v0.4
version: v0.4
project:
  name: Roy's strong six exponentials theorem and Roy's rank bound for matrices of logarithms
  description: Roy's strong six exponentials theorem (Roy 1992, Corollary 2; Waldschmidt 2000, Corollary
    11.16). If x₁, x₂ and y₁, y₂, y₃ are each linearly independent over the algebraic numbers Q̄,
    then one of the six products xᵢ yⱼ lies outside ℒ̃, the Q̄-span of 1 and the logarithms of algebraic
    numbers. Roy's rank bound (Roy 1992, Corollary 1; Waldschmidt 2000, Theorem 12.20 and Corollary
    12.21). For a d × l matrix M with entries in ℒ̃, there are invertible algebraic matrices P, Q
    and sizes 0 < d' ≤ d, l' ≤ l such that PMQ has a zero d' × (l − l') block and d l' ≤ rank(M) (d'
    + l'). This repository is a self-contained extract of these theorems from the library github.com/carlok/diaz-modulus-lean,
    which is the canonical home of the proofs.
  authors:
  - Carlo Perassi
  license: Apache-2.0
  responsible_maintainers:
  - Carlo Perassi
classification:
  arxiv:
  - math.NT
  - cs.LO
  msc2020:
  - 11J86
  - 11J81
  - 68V20
sources:
- title: Matrices whose coefficients are linear forms in logarithms
  authors:
  - Damien Roy
  type: paper
  location: Journal of Number Theory 41 (1992), 22–47
  relationship: formalizes
  note: Corollary 1 (the rank bound) and Corollary 2 (the strong six exponentials theorem).
  license: unknown
  author_endorsement: n/a
- title: Diophantine Approximation on Linear Algebraic Groups
  authors:
  - Michel Waldschmidt
  type: book
  location: Grundlehren der mathematischen Wissenschaften 326, Springer, 2000
  relationship: formalizes
  note: Corollary 11.16 via Theorem 11.21, and Theorem 12.20 with Corollary 12.21. The multiplicity
    estimate these rest on is proved in the elementary case the argument needs (Theorem 8.1).
  license: unknown
  author_endorsement: n/a
- title: Lemmes de zéros dans les groupes algébriques commutatifs
  authors:
  - Patrice Philippon
  type: paper
  location: Bulletin de la Société Mathématique de France 114 (1986), 355–383
  relationship: background
  note: The multiplicity estimate in general; the library proves only the elementary case it uses.
  license: unknown
  author_endorsement: n/a
